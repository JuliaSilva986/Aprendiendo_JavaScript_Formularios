<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Eventos</title>

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>

    <main>
        <h1>Registro de Eventos</h1>
        <p>Completa el formulario para registrarte</p>

        <form id="formulario" novalidate>

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono"
                   placeholder="10 dígitos" required>

            <fieldset>
                <legend>Selecciona tus intereses:</legend>

                <label>
                    <input type="checkbox"
                           name="intereses" value="Tecnología">
                    Tecnología
                </label>

                <label>
                    <input type="checkbox"
                           name="intereses" value="Arte">
                    Arte
                </label>

                <label>
                    <input type="checkbox"
                           name="intereses" value="Ciencia">
                    Ciencia
                </label>
            </fieldset>

            <fieldset>
                <legend>Horario preferido:</legend>

                <label>
                    <input type="radio"
                           name="horario" value="Mañana">
                    Mañana
                </label>

                <label>
                    <input type="radio"
                           name="horario" value="Tarde">
                    Tarde
                </label>

                <label>
                    <input type="radio"
                           name="horario" value="Noche">
                    Noche
                </label>
            </fieldset>

            <label for="fecha">Fecha del evento:</label>
            <input type="date" id="fecha" required>

            <label for="archivo">
                Documento de identificación (opcional):
            </label>

            <input type="file" id="archivo"
                   accept=".pdf,.jpg,.jpeg,.png">

            <button type="submit">Registrarse</button>

        </form>

        <div id="resultado" role="status"
             aria-live="polite"></div>

    </main>

</body>
</html>
